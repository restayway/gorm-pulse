services:
  nats:
    image: nats:2.10-alpine
    container_name: gormpulse-nats
    ports:
      - "14222:4222"  # Client connections (host:14222 -> container:4222)
      - "18222:8222"  # HTTP monitoring
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
